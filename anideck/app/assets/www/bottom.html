<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1240, user-scalable=no">
<link rel="stylesheet" href="bottom.css">
</head>
<body>
<nav id="rail">
  <div class="logo">Ani<b>Deck</b></div>
  <button class="tab" data-tab="now"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path class="fill" d="M10 8.2v7.6l6-3.8z"/></svg><span>Now Playing</span></button>
  <button class="tab" data-tab="next"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="M8 10h8M8 14h5"/></svg><span>Up Next</span><i class="badge" id="newBadge"></i></button>
  <button class="tab" data-tab="schedule"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Schedule</span></button>
  <button class="tab" data-tab="lists"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg><span>Lists</span></button>
  <button class="tab" data-tab="browse"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 20 20"/></svg><span>Browse</span></button>
  <button class="tab" data-tab="downloads"><svg viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5"/><path d="M5 19.5h14"/></svg><span>Downloads</span><i class="badge dl" id="dlBadge"></i></button>
  <button class="tab" data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M5.5 18.5l2.1-2.1M16.4 7.6l2.1-2.1"/></svg><span>Settings</span></button>
</nav>
<main>
  <header id="bar">
    <h1 id="heading"></h1>
    <div class="status"><span id="pad"></span><span id="net"></span><span id="who"></span><span id="clock"></span></div>
  </header>
  <div id="offline" hidden>No internet. Playback and list syncing are paused until Wi-Fi is back.</div>
  <section id="view"></section>
</main>
<div id="toast"></div>
<script src="nav.js"></script>
<script src="bottom.js"></script>
</body>
</html>
